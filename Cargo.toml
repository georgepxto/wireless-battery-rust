[package]
name = "wireless-battery"
version = "0.12.0"
license = "GPL-3.0-only"
edition = "2021"
description = "Bateria dos dispositivos sem fio na barra de tarefas do Windows"

# APIs WinRT: Bluetooth LE (GATT), controles (Windows.Gaming.Input) e notificacoes.
[dependencies.windows]
version = "0.58"
features = [
    "Data_Xml_Dom",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Power",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "Win32_System_Com",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Gera as imagens do README: cargo run --release --features snapshot -- --snapshot docs
snapshot = []
# Diagnostico do protocolo do MCHOSE: cargo run --release --features probe -- --probe-mchose
probe = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

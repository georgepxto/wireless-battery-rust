name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup override set stable-x86_64-pc-windows-gnu

      - name: Testes
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --features probe,snapshot --locked -- -D warnings

      - name: Build de release
        run: cargo build --release --locked

      - name: Capturas do widget
        run: cargo run --release --features snapshot --locked -- --snapshot snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png

      # As mesmas capturas num branch a parte, para conferir o desenho sem baixar o artefato.
      - name: Publicar capturas no branch ci-snapshots
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          cd snapshots
          git init -q -b ci-snapshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Capturas de ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-snapshots
